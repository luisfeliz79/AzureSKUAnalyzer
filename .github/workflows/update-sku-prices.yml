name: Update SKU Price Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 4"

permissions:
  contents: write

jobs:
  update-sku-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run pricing data script
        working-directory: update-scripts
        run: python get-prices.py

      - name: Copy generated report to repository root
        run: cp update-scripts/sku-price-report-by-region.json sku-price-report-by-region.json

      - name: Commit and push updated report
        run: |
          if git diff --quiet -- sku-price-report-by-region.json; then
            echo "No changes detected in sku-price-report-by-region.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sku-price-report-by-region.json
          git commit -m "chore: update sku price report"
          git push
